<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBg)" stroke="url(#glowBorder)" stroke-width="4" />
  
  <!-- Subtle tech circles -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="200" cy="200" r="115" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" />

  <!-- Code bracket motifs -->
  <path d="M 100 160 L 70 200 L 100 240" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 300 160 L 330 200 L 300 240" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram S I -->
  <text x="200" y="225" fill="url(#monogramGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="96" font-weight="900" text-anchor="middle" letter-spacing="-2">SI</text>
  
  <!-- Tagline below -->
  <rect x="110" y="270" width="180" height="32" rx="16" fill="#1e293b" stroke="#4f46e5" stroke-width="1" />
  <text x="200" y="291" fill="#a5b4fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">FULL STACK DEV</text>
</svg>
