<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141e33" />
    </linearGradient>
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad2)" />

  <!-- App Header Bar -->
  <rect x="30" y="30" width="740" height="50" rx="8" fill="#1e293b" />
  <circle cx="55" cy="55" r="6" fill="#ef4444" />
  <circle cx="75" cy="55" r="6" fill="#f59e0b" />
  <circle cx="95" cy="55" r="6" fill="#10b981" />
  <text x="125" y="60" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">TeamSync | Employee Management Dashboard</text>

  <!-- Search & Action Controls -->
  <rect x="30" y="95" width="280" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="50" cy="114" r="5" stroke="#94a3b8" stroke-width="1.5" fill="none" />
  <line x1="54" y1="118" x2="59" y2="123" stroke="#94a3b8" stroke-width="1.5" />
  <text x="70" y="119" fill="#94a3b8" font-family="sans-serif" font-size="12">Search employee by name, ID...</text>

  <rect x="325" y="95" width="130" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="340" y="119" fill="#cbd5e1" font-family="sans-serif" font-size="12">All Departments ▾</text>

  <rect x="470" y="95" width="110" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="485" y="119" fill="#cbd5e1" font-family="sans-serif" font-size="12">Sort: Name (A-Z) ▾</text>

  <rect x="620" y="95" width="150" height="38" rx="6" fill="url(#primaryBtn)" />
  <text x="695" y="119" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">+ Add Employee</text>

  <!-- Employee Table Container -->
  <rect x="30" y="150" width="740" height="240" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />

  <!-- Table Head -->
  <rect x="30" y="150" width="740" height="35" rx="8" fill="#1e293b" />
  <text x="50" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">EMP ID</text>
  <text x="130" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">EMPLOYEE</text>
  <text x="310" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">ROLE / DEPT</text>
  <text x="490" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">STATUS</text>
  <text x="610" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">JOIN DATE</text>
  <text x="710" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">ACTION</text>

  <!-- Row 1 -->
  <line x1="30" y1="230" x2="770" y2="230" stroke="#1f2937" stroke-width="1" />
  <text x="50" y="210" fill="#a5b4fc" font-family="monospace" font-size="12">#EMP-041</text>
  <circle cx="145" cy="206" r="14" fill="#4f46e5" />
  <text x="145" y="210" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SK</text>
  <text x="170" y="206" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Sanjeev Kumar</text>
  <text x="170" y="222" fill="#64748b" font-family="sans-serif" font-size="11">sanjeev@company.com</text>
  <text x="310" y="207" fill="#cbd5e1" font-family="sans-serif" font-size="12">Full Stack Engineer</text>
  <text x="310" y="222" fill="#64748b" font-family="sans-serif" font-size="11">Engineering</text>
  <rect x="485" y="197" width="60" height="20" rx="10" fill="#065f46" fill-opacity="0.4" />
  <text x="515" y="211" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Active</text>
  <text x="610" y="210" fill="#94a3b8" font-family="sans-serif" font-size="12">12 Jan 2026</text>
  <text x="715" y="211" fill="#a78bfa" font-family="sans-serif" font-size="14">⋮</text>

  <!-- Row 2 -->
  <line x1="30" y1="280" x2="770" y2="280" stroke="#1f2937" stroke-width="1" />
  <text x="50" y="260" fill="#a5b4fc" font-family="monospace" font-size="12">#EMP-042</text>
  <circle cx="145" cy="256" r="14" fill="#0284c7" />
  <text x="145" y="260" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AN</text>
  <text x="170" y="256" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Ananya Nair</text>
  <text x="170" y="272" fill="#64748b" font-family="sans-serif" font-size="11">ananya@company.com</text>
  <text x="310" y="257" fill="#cbd5e1" font-family="sans-serif" font-size="12">UI/UX Designer</text>
  <text x="310" y="272" fill="#64748b" font-family="sans-serif" font-size="11">Product Design</text>
  <rect x="485" y="247" width="60" height="20" rx="10" fill="#065f46" fill-opacity="0.4" />
  <text x="515" y="261" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Active</text>
  <text x="610" y="260" fill="#94a3b8" font-family="sans-serif" font-size="12">05 Feb 2026</text>
  <text x="715" y="261" fill="#a78bfa" font-family="sans-serif" font-size="14">⋮</text>

  <!-- Row 3 -->
  <line x1="30" y1="330" x2="770" y2="330" stroke="#1f2937" stroke-width="1" />
  <text x="50" y="310" fill="#a5b4fc" font-family="monospace" font-size="12">#EMP-043</text>
  <circle cx="145" cy="306" r="14" fill="#7c3aed" />
  <text x="145" y="310" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RR</text>
  <text x="170" y="306" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Rahul Roy</text>
  <text x="170" y="322" fill="#64748b" font-family="sans-serif" font-size="11">rahul@company.com</text>
  <text x="310" y="307" fill="#cbd5e1" font-family="sans-serif" font-size="12">QA Automation</text>
  <text x="310" y="322" fill="#64748b" font-family="sans-serif" font-size="11">Quality</text>
  <rect x="485" y="297" width="60" height="20" rx="10" fill="#854d0e" fill-opacity="0.4" />
  <text x="515" y="311" fill="#fde047" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">On Leave</text>
  <text x="610" y="310" fill="#94a3b8" font-family="sans-serif" font-size="12">20 Feb 2026</text>
  <text x="715" y="311" fill="#a78bfa" font-family="sans-serif" font-size="14">⋮</text>

  <!-- Pagination Bottom -->
  <text x="50" y="365" fill="#64748b" font-family="sans-serif" font-size="12">Showing 1 to 3 of 42 employees</text>
  <rect x="620" y="350" width="28" height="25" rx="4" fill="#334155" />
  <text x="634" y="367" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">‹</text>
  <rect x="655" y="350" width="28" height="25" rx="4" fill="#6366f1" />
  <text x="669" y="367" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1</text>
  <rect x="690" y="350" width="28" height="25" rx="4" fill="#1e293b" />
  <text x="704" y="367" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">2</text>
  <rect x="725" y="350" width="28" height="25" rx="4" fill="#334155" />
  <text x="739" y="367" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">›</text>
</svg>
